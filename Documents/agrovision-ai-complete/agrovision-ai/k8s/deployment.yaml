# ─── Namespace ────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: agrovision
---
# ─── Backend Deployment ───────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrovision-backend
  namespace: agrovision
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agrovision-backend
  template:
    metadata:
      labels:
        app: agrovision-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/yourusername/agrovision-ai/backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: production
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agrovision-secrets
                  key: jwt-secret
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agrovision-secrets
                  key: supabase-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agrovision-backend-svc
  namespace: agrovision
spec:
  selector:
    app: agrovision-backend
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
---
# ─── ML Service Deployment ────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrovision-ml
  namespace: agrovision
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agrovision-ml
  template:
    metadata:
      labels:
        app: agrovision-ml
    spec:
      containers:
        - name: ml-service
          image: ghcr.io/yourusername/agrovision-ai/ml-service:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agrovision-ml-svc
  namespace: agrovision
spec:
  selector:
    app: agrovision-ml
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
# ─── Horizontal Pod Autoscaler ────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agrovision-backend-hpa
  namespace: agrovision
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agrovision-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ─── Ingress ──────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agrovision-ingress
  namespace: agrovision
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.agrovision.ai
      secretName: agrovision-tls
  rules:
    - host: api.agrovision.ai
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agrovision-backend-svc
                port:
                  number: 4000
          - path: /ml
            pathType: Prefix
            backend:
              service:
                name: agrovision-ml-svc
                port:
                  number: 8000
