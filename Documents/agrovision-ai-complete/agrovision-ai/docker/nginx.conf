events { worker_connections 1024; }

http {
  upstream frontend  { server frontend:3000; }
  upstream backend   { server backend:4000; }
  upstream ml        { server ml-service:8000; }

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=ml:10m  rate=20r/m;

  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  server {
    listen 80;
    server_name agrovision.ai www.agrovision.ai;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name agrovision.ai;

    # SSL (replace with your certs or use certbot)
    # ssl_certificate /etc/ssl/certs/agrovision.crt;
    # ssl_certificate_key /etc/ssl/private/agrovision.key;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Frontend
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }

    # ML API
    location /ml/ {
      limit_req zone=ml burst=5 nodelay;
      proxy_pass http://ml/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
      client_max_body_size 10M;
    }

    # WebSocket
    location /socket.io/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
